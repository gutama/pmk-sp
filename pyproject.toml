[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmi-simengine"
version = "1.0.0"
description = "FMI Simulation Engine — Simulator Benchmarking Indikator PMK Sub-Protokol Sistem Pembayaran Wholesale"
requires-python = ">=3.11"
dependencies = [
    "mesa>=2.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-socketio>=5.11",
    "duckdb>=0.10",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "python-igraph>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-asyncio>=0.23"]
opt = ["cvxpy>=1.4", "ortools>=9.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/fmi_sim"]
